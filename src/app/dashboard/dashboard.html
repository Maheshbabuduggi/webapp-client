<app-header [user]="user()" (logoutClick)="logout()"></app-header>

<div class="links">
  @if (user()?.isAdmin || user()?.isHr) {
    <a routerLink="/hr" class="dashboard-link">HR</a>
  }
  @if (user()?.isAdmin || user()?.isHrManager) {
    <a routerLink="/hr-manager" class="dashboard-link">HR Manager</a>
  }
</div>
