<div class="login-container">

  <div class="login-card">

    <h1>Login</h1>

    <form
      (ngSubmit)="login()">

      <div class="form-group">

        <label>
          Username
        </label>

        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          required
        />

      </div>


      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
        />

      </div>


      @if (errorMessage) {

        <div class="error">

          {{ errorMessage }}

        </div>

      }


      <button
        type="submit"
        [disabled]="loading">

        @if (loading) {
          Logging in...
        }
        @else {
          Login
        }

      </button>

    </form>


    <div class="test-users">

      <h3>Test Users</h3>

      <p>
        <strong>Admin:</strong>
        admin / password
      </p>

      <p>
        <strong>HR:</strong>
        hruser / hr123
      </p>

      <p>
        <strong>HR Manager:</strong>
        hrmanager / manager123
      </p>

    </div>

  </div>

</div>
