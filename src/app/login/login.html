<div class="login-container">

  <div class="login-card">

    <h1>Login</h1>

    <form
      (ngSubmit)="login()">

      <div class="form-group">

        <label>
          Username
        </label>

        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          required
        />

      </div>


      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          required
        />

      </div>


      @if (errorMessage) {

        <div class="error">

          {{ errorMessage }}

        </div>

      }


      <button
        type="submit"
        [disabled]="loading">

        @if (loading) {
          Logging in...
        }
        @else {
          Login
        }

      </button>

    </form>



  </div>

</div>
